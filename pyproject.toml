[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eathalf-food-recognition"
version = "0.1.0"
description = "Food image classification research prototype with optional YOLO exploration"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Oludotun Babayemi"}]
dependencies = ["tensorflow>=2.16,<2.19", "numpy>=1.26,<2.1", "Pillow>=10.3,<12", "scikit-learn>=1.4,<1.7", "matplotlib>=3.8,<3.11"]

[project.optional-dependencies]
detection = ["ultralytics>=8.3,<9"]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<7"]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]
