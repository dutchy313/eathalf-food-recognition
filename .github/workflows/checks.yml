name: Lightweight checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy Pillow scikit-learn pytest
      - run: python -m compileall -q src
      - run: python -m pytest -q
        env:
          PYTHONPATH: src
# TensorFlow training and optional serialization tests are not covered by this lightweight job.
